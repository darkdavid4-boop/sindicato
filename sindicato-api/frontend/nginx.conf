server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 21m;
    add_header Cache-Control "no-cache, must-revalidate" always;

    location /api/afiliados {
        proxy_pass http://afiliados:8081;
    }

    location /api/noticias {
        proxy_pass http://noticias:8082;
    }

    location /api/actividades {
        proxy_pass http://actividades:8083;
    }

    location /api/documentos {
        proxy_pass http://documentacion:8085;
    }

    location /media/afiliados/ {
        proxy_pass http://afiliados:8081/uploads/;
    }

    location /media/noticias/ {
        proxy_pass http://noticias:8082/uploads/;
    }

    location /media/actividades/ {
        proxy_pass http://actividades:8083/uploads/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
