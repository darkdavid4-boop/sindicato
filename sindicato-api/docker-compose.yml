services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15

  afiliados:
    build:
      context: .
      dockerfile: Dockerfile.afiliados
    environment: &service-env
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/afiliados?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:8081}
      APP_UPLOAD_DIR: /app/uploads
      APP_AUTH_SECRET: ${APP_AUTH_SECRET:-c2luZGljYXRvLWxvY2FsLWRldi1zZWNyZXQtMzItYnl0ZXMh}
      APP_ADMIN_EMAILS: ${APP_ADMIN_EMAILS:-darkdavid4@gmail.com}
    ports:
      - "8081:8081"
    volumes:
      - afiliados_uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy

  documentacion:
    build:
      context: .
      dockerfile: Dockerfile.documentacion
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/documentacion?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      APP_DOCUMENTOS_DIR: /app/documentos
      APP_DOCUMENTOS_KEY: ${APP_DOCUMENTOS_KEY:-uQAmx4ktYueVUv49uow9k3D4JY0PH3cbDe5KK27pmXg=}
      APP_AUTH_SECRET: ${APP_AUTH_SECRET:-c2luZGljYXRvLWxvY2FsLWRldi1zZWNyZXQtMzItYnl0ZXMh}
    ports:
      - "8085:8085"
    volumes:
      - documentacion_files:/app/documentos
    depends_on:
      mysql:
        condition: service_healthy

  noticias:
    build:
      context: .
      dockerfile: Dockerfile.noticias
    environment:
      <<: *service-env
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/noticias?createDatabaseIfNotExist=true
    ports:
      - "8082:8082"
    volumes:
      - noticias_uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy

  actividades:
    build:
      context: .
      dockerfile: Dockerfile.actividades
    environment:
      <<: *service-env
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/actividades?createDatabaseIfNotExist=true
    ports:
      - "8083:8083"
    volumes:
      - actividades_uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy

  notificaciones:
    build:
      context: .
      dockerfile: Dockerfile.notificaciones
    environment:
      <<: *service-env
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/notificaciones?createDatabaseIfNotExist=true
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-darkdavid4@gmail.com}
      SMTP_USERNAME: ${SMTP_USERNAME:-darkdavid4@gmail.com}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-kcjdgxcctdjnjjaxd}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mailpit:
        condition: service_started

  mailpit:
    image: axllent/mailpit:v1.22
    ports:
      - "8025:8025"
      - "1025:1025"

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - afiliados
      - noticias
      - actividades
      - documentacion

volumes:
  mysql_data:
  afiliados_uploads:
  noticias_uploads:
  actividades_uploads:
  documentacion_files:
